name: Release

# Publishes to npm and creates a GitHub release when a version tag is pushed:
#
#   npm version patch   # or minor / major; updates package.json and creates the tag
#   git push --follow-tags
#
# Authenticates with npm trusted publishing (OIDC), so no npm token secret is needed. The trusted publisher is
# configured on npmjs.com: package Settings > Trusted Publisher > GitHub Actions, workflow `release.yml`.
# A tag whose version is already on npm (e.g. published by hand) skips the publish and still gets a GitHub release.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write # create the GitHub release
  id-token: write # npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # ships npm 11, which trusted publishing needs (11.5.1+)
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
          source_version="$(sed -n "s/^export const PACKAGE_VERSION = '\(.*\)';$/\1/p" src/models.ts)"
          if [ "$source_version" != "$version" ]; then
            echo "PACKAGE_VERSION in src/models.ts ($source_version) does not match package.json ($version)" >&2
            exit 1
          fi

      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Publish to npm
        # Pre-release versions (1.0.0-beta.1) go to the `next` tag so `npm install` keeps resolving to stable.
        run: |
          name="$(node -p "require('./package.json').name")"
          if npm view "$name@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "$name@${GITHUB_REF_NAME#v} is already on npm; skipping publish."
            exit 0
          fi
          case "$GITHUB_REF_NAME" in
            *-*) tag=next ;;
            *) tag=latest ;;
          esac
          npm publish --access public --provenance --tag "$tag" --ignore-scripts

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            /^## / { printing = ($2 == version) ; next }
            printing { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "See CHANGELOG.md." > release-notes.md
          fi

      - name: Create GitHub release
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --prerelease ;;
            *) gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md ;;
          esac
        env:
          GH_TOKEN: ${{ github.token }}
